name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - name: Install dependencies
        run: npm ci --verbose --no-fund --no-audit
      - name: Build website
        run: npm run build
        env:
          VITE_API_URL: https://api.whyaresalesdown.com
          VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
          VITE_APP_POOL_ID: ${{ secrets.VITE_APP_POOL_ID }}
      - name: Set AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Copy to S3
        run: |
          aws s3 sync ./dist/ s3://why-are-sales-down-716892364122-us-east-2-an/
          aws s3 cp ./dist/index.html s3://why-are-sales-down-716892364122-us-east-2-an/index.html --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E35U0AKSXAC35Q \
            --paths "/*"
